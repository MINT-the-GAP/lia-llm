<!doctype html>
<meta charset="utf-8">
<title>lia-llm browser API smoke test</title>
<style>
  :root {
    --color-background: 255, 255, 255;
    --color-text: 75, 75, 75;
  }
  :root.lia-variant-dark {
    --color-background: 50, 50, 50;
    --color-text: 255, 255, 255;
  }
  .lia-link { color: rgb(var(--color-highlight)); }
</style>
<body>
  <main class="lia-slide__content">
    <div
      id="textarea-owner"
      class="lia-quiz"
      data-llm-textarea="5"
      data-elm-owned-container
    >
      <span id="textarea-label" hidden>Ausführliche Begründung</span>
      <span id="textarea-help" hidden>Begründe in mehreren Sätzen.</span>
      <span id="textarea-error" hidden>Die Antwort ist noch nicht korrekt.</span>
      <input
        class="lia-quiz__input is-failure"
        aria-label="Testantwort"
        aria-labelledby="textarea-label"
        aria-describedby="textarea-help"
        aria-errormessage="textarea-error"
      >
    </div>
    <lia-llm-textarea-host
      id="textarea-host"
      data-elm-owned-host
      hidden
    >elm-owned-placeholder</lia-llm-textarea-host>
  </main>
  <div id="quiz-layout-probe" class="lia-quiz" data-llm-textarea>
    <ul id="empty-hints-probe" class="lia-quiz__hints"></ul>
  </div>
  <lia-llm-solution
    id="solution-probe"
    data-elm-owned-host
  >elm-owned-placeholder</lia-llm-solution>
  <lia-llm-feedback
    id="feedback-probe"
    data-elm-owned-host
  >elm-owned-placeholder</lia-llm-feedback>
  <lia-llm-result-separator id="separator-probe"></lia-llm-result-separator>
  <lia-llm-activity
    id="activity-probe"
    data-elm-owned-host
    hidden
  >elm-owned-placeholder</lia-llm-activity>
  <lia-llm-activity
    id="activity-probe-two"
    data-elm-owned-host
    hidden
  >elm-owned-placeholder</lia-llm-activity>
  <lia-llm-load-overlay-host
    id="load-overlay-host"
    data-elm-owned-host
  >elm-owned-placeholder</lia-llm-load-overlay-host>
  <script>
  window.__liaCalibration = []
  window.__liaCalibrationExpected = 1
  window.__liaCalibrationDone = false
  const elmOwnedLightDom = new Map(
    Array.from(
      document.querySelectorAll(
        "[data-elm-owned-host], [data-elm-owned-container]"
      ),
      host => [host, Array.from(host.childNodes)]
    )
  )
  for (const nodes of elmOwnedLightDom.values()) {
    for (const node of nodes) node.created_by_elm = true
  }
  document.documentElement.style.setProperty(
    "--color-highlight",
    "17, 34, 51"
  )
  window.__liaBundleLoad = (async () => {
    const response = await fetch("../dist/index.js")
    if (!response.ok) {
      throw new Error(`Bundle konnte nicht geladen werden (${response.status}).`)
    }
    const source = await response.text()
    const blobUrl = URL.createObjectURL(
      new Blob([source], { type: "text/javascript" })
    )
    try {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script")
        script.src = blobUrl
        script.addEventListener("load", resolve, { once: true })
        script.addEventListener(
          "error",
          () => reject(new Error("Bundle konnte nicht ausgefuehrt werden.")),
          { once: true }
        )
        document.head.append(script)
      })
    } finally {
      URL.revokeObjectURL(blobUrl)
    }
  })()

  ;(async () => {
    try {
      await window.__liaBundleLoad
      const initial = window.LiaLLM?.getStatus()
      if (document.readyState === "loading") {
        await new Promise(resolve =>
          document.addEventListener("DOMContentLoaded", resolve, { once: true })
        )
      }
      await Promise.resolve()

      const named = window.LiaLLM?.parseMacroOptions(
        "0.66;solution=1;feedback=1;operator=erklaeren"
      )
      const positional = window.LiaLLM?.parseMacroOptions("0.66;1;1;erklaeren")
      const language = window.LiaLLM?.parseMacroOptions(
        "0.66;solution=1;feedback=1;operator=erklaeren;Rechtschreibung=1;Satzbau=1"
      )
      const thinking = window.LiaLLM?.parseMacroOptions(
        "0.66;maxthinkingtime=20s;maxthinkingtokens=high"
      )
      const extremeThinking = window.LiaLLM?.parseMacroOptions(
        "0.66;maxthinkingtokens=extreme"
      )
      const explicitCompact = window.LiaLLM?.parseMacroOptions(
        "0.66;assessmentengine=compact"
      )
      const explicitQuality = window.LiaLLM?.parseMacroOptions(
        "0.66;assessmentengine=QUALITY"
      )
      const compactThinkingDisabled = window.LiaLLM?.parseMacroOptions(
        "0.66;assessmentengine=compact;maxthinkingtime=0s"
      )
      const parsedReferenceVariants = window.LiaLLM?.parseReferenceVariants(
        [
          "Erster Weg mit $a^2$.",
          "<!-- lia-llm:alternative -->",
          "## Zweiter Weg",
          "",
          "$$b^2$$"
        ].join("\r\n")
      )
      const referenceVariantParserWorks =
        JSON.stringify(parsedReferenceVariants) ===
        JSON.stringify([
          "Erster Weg mit $a^2$.",
          "## Zweiter Weg\n\n$$b^2$$"
        ])
      const solutionVariantId = "browser-solution-variant-probe"
      window.LiaLLM?.setSolutionVariant?.(solutionVariantId, "run-one")
      window.LiaLLM?.setSolutionVariant?.(solutionVariantId, "run-one", 1)
      const firstSolutionVariantWasStored =
        window.LiaLLM?.getSolutionVariant?.(solutionVariantId) === 1
      window.LiaLLM?.setSolutionVariant?.(solutionVariantId, "run-two")
      const newSolutionRunResetTheIndex =
        window.LiaLLM?.getSolutionVariant?.(solutionVariantId) === undefined
      window.LiaLLM?.setSolutionVariant?.(solutionVariantId, "run-one", 0)
      window.LiaLLM?.clearSolutionVariant?.(solutionVariantId, "run-one")
      const staleSolutionRunWasIgnored =
        window.LiaLLM?.getSolutionVariant?.(solutionVariantId) === undefined
      window.LiaLLM?.setSolutionVariant?.(solutionVariantId, "run-two", 0)
      window.LiaLLM?.clearSolutionVariant?.(solutionVariantId, "run-one")
      const activeSolutionRunSurvivedStaleClear =
        window.LiaLLM?.getSolutionVariant?.(solutionVariantId) === 0
      window.LiaLLM?.clearSolutionVariant?.(solutionVariantId, "run-two")
      const solutionVariantRegistryIsRunScoped =
        firstSolutionVariantWasStored &&
        newSolutionRunResetTheIndex &&
        staleSolutionRunWasIgnored &&
        activeSolutionRunSurvivedStaleClear &&
        window.LiaLLM?.getSolutionVariant?.(solutionVariantId) === undefined
      let compactAdvancedRejected = false
      try {
        window.LiaLLM?.parseMacroOptions(
          "0.66;assessmentengine=compact;operator=erklaeren"
        )
      } catch (error) {
        compactAdvancedRejected =
          error instanceof Error &&
          error.message.includes("assessmentengine=quality")
      }
      const solution = document.getElementById("solution-probe")
      const solutionContent = () =>
        solution?.shadowRoot?.querySelector(".lia-llm-solution-content")
      const solutionStartedHidden =
        solution?.hidden === true && solution?.style.display === "none"
      window.LiaLLM?.showSolution(
        "solution-probe",
        "Erster Absatz.\n\nZweiter Absatz."
      )
      const feedbackProbe = document.getElementById("feedback-probe")
      window.LiaLLM?.showFeedback(
        "feedback-probe",
        "Sprachstatistik:\nWörter insgesamt: 2"
      )
      const feedbackPreservesLineBreaks =
        feedbackProbe?.shadowRoot?.querySelector(".lia-llm-feedback-content")
          ?.textContent ===
          "Sprachstatistik:\nWörter insgesamt: 2" &&
        feedbackProbe?.style.whiteSpace === "pre-line"
      const feedbackUsesCompactThemeStyle =
        feedbackProbe?.classList.contains("lia-link") === true &&
        parseFloat(feedbackProbe?.style.marginBlockStart || "") === 0.75
      const quizSpacingIsCompacted =
        getComputedStyle(
          document.getElementById("quiz-layout-probe")
        ).marginBottom === "0px" &&
        getComputedStyle(
          document.getElementById("empty-hints-probe")
        ).display === "none"
      const separatorProbe = document.getElementById("separator-probe")
      const resultSeparatorMatchesTheme =
        separatorProbe?.getAttribute("role") === "separator" &&
        separatorProbe?.getAttribute("aria-orientation") === "horizontal" &&
        separatorProbe?.classList.contains("lia-link") === true &&
        separatorProbe?.style.borderBlockStartWidth === "1px" &&
        separatorProbe?.style.borderBlockStartStyle === "solid" &&
        getComputedStyle(separatorProbe).borderTopColor ===
          "rgb(17, 34, 51)" &&
        parseFloat(separatorProbe?.style.marginBlockStart || "") === 1 &&
        parseFloat(separatorProbe?.style.marginBlockEnd || "") === 1.5
      const solutionBecameVisible =
        solution?.hidden === false && solution?.style.display === "block"
      window.LiaLLM?.showSolution("solution-probe", "")
      const solutionHidesWhenCleared =
        solution?.hidden === true &&
        solution?.style.display === "none" &&
        solutionContent()?.textContent === ""
      window.LiaLLM?.showSolution(
        "solution-probe",
        "Erster Absatz.\n\nZweiter Absatz."
      )

      const originalPreload = window.LiaLLM?.preload
      let quizPresencePreloadCalls = 0
      if (window.LiaLLM && originalPreload) {
        window.LiaLLM.preload = async () => {
          quizPresencePreloadCalls += 1
          return initial
        }
      }
      const quizUseOne = document.createElement("lia-llm-quiz-use")
      const quizUseTwo = document.createElement("lia-llm-quiz-use")
      document.body.append(quizUseOne, quizUseTwo)
      await Promise.resolve()
      const quizPresenceStartsOnce =
        quizPresencePreloadCalls === 1 &&
        quizUseOne.hidden === true &&
        quizUseOne.style.display === "none" &&
        quizUseOne.getAttribute("aria-hidden") === "true" &&
        quizUseTwo.hidden === true
      quizUseOne.remove()
      quizUseTwo.remove()
      if (window.LiaLLM && originalPreload) {
        window.LiaLLM.preload = originalPreload
      }

      const activity = document.getElementById("activity-probe")
      const secondActivity = document.getElementById("activity-probe-two")
      window.LiaLLM?.showActivity(
        "activity-probe",
        "run-one",
        "preparing-compact"
      )
      const activityStarted =
        activity?.hidden === false &&
        activity?.style.display === "grid" &&
        activity?.getAttribute("aria-busy") === "true" &&
        activity?.shadowRoot?.querySelector(".lia-llm-activity-label")
          ?.textContent ===
          "Kompaktmodell wird vorbereitet …" &&
        activity?.shadowRoot?.querySelector(".lia-llm-activity-track")
          ?.getAttribute("role") === "progressbar" &&
        !activity?.shadowRoot?.querySelector(".lia-llm-activity-track")
          ?.hasAttribute("aria-valuenow")
      window.LiaLLM?.showActivity(
        "activity-probe",
        "run-two",
        "selecting-model"
      )
      window.LiaLLM?.showActivity(
        "activity-probe",
        "run-two",
        "evaluating-quality",
        { thinkingTimeLimitMs: 1500 }
      )
      const potentialThinkingLimitIsShown =
        activity?.shadowRoot?.querySelector(".lia-llm-activity-countdown")
          ?.textContent ===
          "Denkzeitbudget bei Bedarf: bis zu 2 s."
      window.LiaLLM?.showActivity(
        "activity-probe",
        "run-two",
        "evaluating-quality",
        {
          thinkingTimeLimitMs: 1500,
          thinkingTimeRemainingMs: 1200
        }
      )
      const countdown = activity?.shadowRoot?.querySelector(
        ".lia-llm-activity-countdown"
      )
      const countdownBeforeTick = countdown?.textContent
      const thinkingCountdownStartsAccessibly =
        countdownBeforeTick ===
          "Denkzeitbudget: noch 2 s." &&
        countdown?.getAttribute("aria-hidden") === "true" &&
        activity?.getAttribute("aria-label")?.includes(
          "noch 2 Sekunden"
        ) === true
      window.LiaLLM?.showActivity(
        "activity-probe",
        "run-one",
        "evaluating-compact"
      )
      const staleRunCannotReplaceCurrent =
        activity?.shadowRoot?.querySelector(".lia-llm-activity-message")
          ?.textContent ===
          "Antwort wird gründlich geprüft …" &&
        countdown?.textContent === countdownBeforeTick
      window.LiaLLM?.showActivity("activity-probe", "run-one", "")
      await new Promise(resolve => setTimeout(resolve, 400))
      const countdownAfterTick = countdown?.textContent
      const thinkingCountdownRuns =
        countdownAfterTick !== countdownBeforeTick &&
        (countdownAfterTick ===
          "Denkzeitbudget: noch 1 s." ||
          countdownAfterTick ===
            "Denkzeitlimit erreicht – laufende Prüfung wird abgeschlossen …")
      const staleRunCannotHideCurrent =
        activity?.hidden === false &&
        activity?.shadowRoot?.querySelector(".lia-llm-activity-message")
          ?.textContent ===
          "Antwort wird gründlich geprüft …"
      window.LiaLLM?.showActivity(
        "activity-probe-two",
        "second-run",
        "evaluating-compact"
      )
      window.LiaLLM?.showActivity("activity-probe", "run-two", "")
      const activitiesStayIsolated =
        activity?.hidden === true &&
        activity?.style.display === "none" &&
        activity?.getAttribute("aria-busy") === "false" &&
        secondActivity?.hidden === false &&
        secondActivity?.shadowRoot?.querySelector(".lia-llm-activity-label")
          ?.textContent ===
          "Antwort wird schnell geprüft …"
      window.LiaLLM?.showActivity("activity-probe-two", "second-run", "")
      const activityClears = secondActivity?.hidden === true

      const textareaOwner = document.getElementById("textarea-owner")
      const textareaHost = document.getElementById("textarea-host")
      const area = textareaHost?.shadowRoot?.querySelector(
        "textarea[data-lia-llm-textarea]"
      )
      const textareaLivesOnlyInShadow =
        area?.getRootNode() === textareaHost?.shadowRoot &&
        textareaOwner?.querySelector("textarea") === null
      const descriptionId = area?.getAttribute("aria-describedby")
      const localDescription = descriptionId
        ? textareaHost?.shadowRoot?.getElementById(descriptionId)
        : null
      const textareaAriaStaysInsideShadow =
        area?.getAttribute("aria-label") === "Ausführliche Begründung" &&
        area?.hasAttribute("aria-labelledby") === false &&
        localDescription?.getRootNode() === textareaHost?.shadowRoot &&
        localDescription?.textContent ===
          "Begründe in mehreren Sätzen. Die Antwort ist noch nicht korrekt."
      const textareaStyle =
        area instanceof HTMLTextAreaElement ? getComputedStyle(area) : null
      const textareaValidationIsVisible =
        area?.classList.contains("is-failure") === true &&
        area?.getAttribute("aria-invalid") === "true" &&
        parseFloat(textareaStyle?.borderLeftWidth ?? "0") >= 2 &&
        textareaStyle?.boxShadow !== "none"
      const helpTextNode =
        document.getElementById("textarea-help")?.firstChild
      if (helpTextNode instanceof Text) {
        helpTextNode.data = "Nutze die Dreiecksungleichung."
      }
      await new Promise(resolve => setTimeout(resolve, 0))
      const textareaAriaTracksTextChanges =
        localDescription?.textContent ===
        "Nutze die Dreiecksungleichung. Die Antwort ist noch nicht korrekt."
      const elmManagedLightDomIsUntouched =
        Array.from(elmOwnedLightDom).every(([host, nodes]) =>
          host.childNodes.length === nodes.length &&
          nodes.every(
            (node, index) =>
              host.childNodes[index] === node &&
              node.created_by_elm === true
          )
        )
      if (area instanceof HTMLTextAreaElement) {
        area.value = "Erster Absatz.\n\nZweiter Absatz."
        area.dispatchEvent(
          new Event("input", { bubbles: true, composed: true })
        )
      }
      const textareaSyncsParagraphs =
        textareaOwner?.querySelector("input")?.value ===
        "Erster Absatz.\u2028\u2028Zweiter Absatz."
      let bubbledKeys = []
      document.body.addEventListener("keydown", event => {
        bubbledKeys.push(event.key)
      })

      const arrow = new KeyboardEvent("keydown", {
        key: "ArrowLeft",
        bubbles: true,
        cancelable: true,
        composed: true
      })
      area?.dispatchEvent(arrow)
      const arrowUp = new KeyboardEvent("keydown", {
        key: "ArrowUp",
        bubbles: true,
        cancelable: true,
        composed: true
      })
      area?.dispatchEvent(arrowUp)
      const letter = new KeyboardEvent("keydown", {
        key: "a",
        bubbles: true,
        cancelable: true,
        composed: true
      })
      area?.dispatchEvent(letter)

      const cacheInfo = await window.LiaLLM?.getCacheInfo()
      const overlayHost = document.getElementById("load-overlay-host")
      const overlay = overlayHost?.shadowRoot?.getElementById(
        "lia-llm-load-overlay"
      )
      const overlayLivesOnlyInShadow =
        overlay?.getRootNode() === overlayHost?.shadowRoot &&
        document.body.querySelector(":scope > #lia-llm-load-overlay") === null
      window.dispatchEvent(
        new CustomEvent("lia-llm:status", {
          detail: {
            phase: "loading",
            loadSource: "cache",
            assessmentEngine: "quality",
            modelId: "quality-test",
            revision: "test",
            device: "webgpu",
            dtype: "q4f16"
          }
        })
      )
      window.dispatchEvent(
        new CustomEvent("lia-llm:progress", {
          detail: {
            status: "loading",
            progress: 42,
            message: "Loading model from cache[31/74]"
          }
        })
      )
      const cachedActivationIsHidden =
        overlay?.dataset.on === "0" &&
        overlay?.getAttribute("aria-hidden") === "true"
      window.dispatchEvent(
        new CustomEvent("lia-llm:status", {
          detail: {
            phase: "ready",
            loadSource: "cache",
            assessmentEngine: "quality",
            modelId: "quality-test",
            revision: "test",
            device: "webgpu",
            dtype: "q4f16"
          }
        })
      )
      const cachedReadyIsHidden =
        overlay?.dataset.on === "0" &&
        overlay?.getAttribute("aria-hidden") === "true" &&
        overlay?.getAttribute("aria-busy") === "false"
      window.dispatchEvent(
        new CustomEvent("lia-llm:status", {
          detail: {
            phase: "loading",
            loadSource: "network",
            assessmentEngine: "quality",
            modelId: "quality-test",
            revision: "test",
            device: "webgpu",
            dtype: "q4f16"
          }
        })
      )
      window.dispatchEvent(
        new CustomEvent("lia-llm:progress", {
          detail: {
            status: "loading",
            progress: 26,
            message: "Loading model weights"
          }
        })
      )
      const realDownloadIsVisible =
        overlay?.dataset.on === "1" &&
        overlay?.dataset.background === "1" &&
        overlay?.getAttribute("aria-hidden") === "false" &&
        overlay?.getAttribute("aria-busy") === "true" &&
        overlay?.querySelector(".lia-llm-load-track")
          ?.getAttribute("aria-valuenow") === "26"
      let consentResponse = null
      const consentDetail = {
        id: "browser-consent-probe",
        engine: "quality",
        modelName: "Qwen3-1.7B Test",
        estimatedBytes: 984000000,
        handled: false,
        respond: value => {
          consentResponse = value
        }
      }
      window.dispatchEvent(
        new CustomEvent("lia-llm:download-consent", {
          detail: consentDetail
        })
      )
      const consentWasVisible =
        overlay?.dataset.consent === "1" &&
        overlay?.dataset.background === "0" &&
        overlay?.getAttribute("role") === "alertdialog" &&
        overlay?.querySelector(".lia-llm-consent-cancel")?.textContent ===
          "Beim kleinen Modell bleiben"
      document.documentElement.classList.add("lia-variant-dark")
      await new Promise(resolve => requestAnimationFrame(resolve))
      const darkOverlayStyle = overlay ? getComputedStyle(overlay) : null
      const consentDownload = overlay?.querySelector(
        ".lia-llm-consent-download"
      )
      const consentDownloadLabel = consentDownload?.querySelector("span")
      const darkConsentTracksTheme = Boolean(
        darkOverlayStyle?.backgroundColor === "rgb(50, 50, 50)" &&
        darkOverlayStyle?.color === "rgb(255, 255, 255)" &&
        consentDownload &&
        consentDownloadLabel &&
        getComputedStyle(consentDownload).backgroundColor ===
          "rgb(255, 255, 255)" &&
        getComputedStyle(consentDownloadLabel).color === "rgb(50, 50, 50)"
      )
      document.documentElement.classList.remove("lia-variant-dark")
      overlay?.querySelector(".lia-llm-consent-cancel")?.click()

      const [ortFactoryResponse, ortWasmResponse] = await Promise.all([
        fetch("../dist/ort-wasm-simd-threaded.asyncify.mjs"),
        fetch("../dist/ort-wasm-simd-threaded.asyncify.wasm")
      ])
      const [ortFactorySource, ortWasmBytes] = await Promise.all([
        ortFactoryResponse.text(),
        ortWasmResponse.arrayBuffer()
      ])
      const ortWasmMagic = new Uint8Array(ortWasmBytes, 0, 4)
      const localOnnxRuntimeIsAvailable =
        ortFactoryResponse.ok &&
        ortWasmResponse.ok &&
        ortFactorySource.includes("WebAssembly") &&
        ortWasmMagic[0] === 0 &&
        ortWasmMagic[1] === 97 &&
        ortWasmMagic[2] === 115 &&
        ortWasmMagic[3] === 109

      const privacyCanary = "STUDENT_ANSWER_MUST_NOT_APPEAR_7f83c1"
      const tokenCanary = "PRIVATE_QUERY_TOKEN_9ac247"
      const stackCanary = "PRIVATE_STACK_VALUE_31be9a"
      const originalRelativeUrl =
        location.pathname + location.search + location.hash
      history.replaceState(
        null,
        "",
        location.pathname + "?token=" + tokenCanary + "#" + stackCanary
      )
      const privacyProbe = document.createElement("textarea")
      privacyProbe.hidden = true
      privacyProbe.value = privacyCanary
      document.body.append(privacyProbe)
      window.__liaPrivacyProbeError = new Error(stackCanary)

      const debugReport = await window.LiaLLM?.debugReport({ print: false })
      const debugReportJson = JSON.stringify(debugReport)
      const debugReportClone = JSON.parse(debugReportJson)
      const debugReportIsSerializable =
        debugReportClone?.schemaVersion === 1 &&
        Array.isArray(debugReportClone?.findings) &&
        Array.isArray(debugReportClone?.events)
      const debugReportIsPrivate =
        !debugReportJson.includes(privacyCanary) &&
        !debugReportJson.includes(tokenCanary) &&
        !debugReportJson.includes(stackCanary) &&
        debugReport?.privacy?.studentContentLogged === false &&
        debugReport?.privacy?.responseBodiesLogged === false &&
        debugReport?.privacy?.stacksLogged === false
      privacyProbe.remove()
      delete window.__liaPrivacyProbeError
      history.replaceState(null, "", originalRelativeUrl)

      await new Promise(resolve => setTimeout(resolve, 450))
      const automaticDebugConsole = []
      const capturedConsoleMethods = [
        "error",
        "warn",
        "info",
        "log",
        "table",
        "groupCollapsed",
        "groupEnd"
      ]
      const originalConsoleMethods = Object.fromEntries(
        capturedConsoleMethods.map(method => [method, console[method]])
      )
      for (const method of capturedConsoleMethods) {
        console[method] = (...args) => {
          automaticDebugConsole.push({ method, args })
        }
      }
      try {
        const syntheticFailure = {
          phase: "error",
          assessmentEngine: "quality",
          modelId: "debug-smoke-model",
          revision: "debug-smoke-revision",
          device: "webgpu",
          dtype: "q4f16",
          error: "Failed to fetch"
        }
        window.dispatchEvent(
          new CustomEvent("lia-llm:status", { detail: syntheticFailure })
        )
        window.dispatchEvent(
          new CustomEvent("lia-llm:status", { detail: syntheticFailure })
        )
        for (let attempt = 0; attempt < 100; attempt += 1) {
          if (
            automaticDebugConsole.some(call => call.method === "groupEnd")
          ) {
            break
          }
          await new Promise(resolve => setTimeout(resolve, 20))
        }
      } finally {
        for (const method of capturedConsoleMethods) {
          console[method] = originalConsoleMethods[method]
        }
        window.dispatchEvent(
          new CustomEvent("lia-llm:status", {
            detail: {
              ...initial,
              phase: "ready",
              loadSource: "cache"
            }
          })
        )
      }
      const manualFailureReport = await window.LiaLLM?.debugReport({
        print: false
      })
      const manualDebugKeepsQualityFailure =
        manualFailureReport?.runtime?.assessmentEngine === "quality" &&
        manualFailureReport?.runtime?.phase === "error" &&
        manualFailureReport?.outcome === "failed" &&
        manualFailureReport?.events.some(
          event =>
            event.kind === "status" &&
            event.engine === "quality" &&
            event.outcome === "error" &&
            event.runId === manualFailureReport.runId
        ) &&
        manualFailureReport?.events.every(
          event =>
            event.engine === undefined ||
            (event.engine === "quality" &&
              event.runId === manualFailureReport.runId)
        )
      window.dispatchEvent(
        new CustomEvent("lia-llm:status", {
          detail: {
            phase: "idle",
            assessmentEngine: "quality",
            modelId: "debug-smoke-model",
            revision: "debug-smoke-revision",
            device: "webgpu",

      try {

      const automaticCacheDebugText = automaticCacheDebugConsole
        .flatMap(call => call.args)

      const automaticCacheDebugBlock = automaticCacheDebugText.match(
        /--- BEGIN LIA-LLM DEBUGNOTIZ ---\n([\s\S]*?)\n--- END LIA-LLM DEBUGNOTIZ ---/u

      let automaticCacheDebugReport = null
      try {

      } catch {

      const automaticCacheDebugNotizIsDeduplicated =

          text.matchAll(

        await window.LiaLLM?.preload().catch(() => undefined)
        for (let attempt = 0; attempt < 100; attempt += 1) {

        await window.LiaLLM?.preload().catch(() => undefined)
        for (let attempt = 0; attempt < 100; attempt += 1) {

        named?.passThreshold === 0.66 &&

        named?.rechtschreibung === false &&
        named?.satzbau === false &&
        JSON.stringify(named) === JSON.stringify(positional) &&
        language?.rechtschreibung === true &&
        language?.satzbau === true &&
        thinking?.maxThinkingTimeMs === 20_000 &&
        thinking?.maxThinkingTokens === 768 &&
        extremeThinking?.maxThinkingTokens === 2_048 &&
        explicitCompact?.assessmentEngine === "compact" &&
        explicitQuality?.assessmentEngine === "quality" &&

        referenceVariantParserWorks &&
        solutionVariantRegistryIsRunScoped &&
        compactAdvancedRejected &&
        area instanceof HTMLTextAreaElement &&
        textareaLivesOnlyInShadow &&

        textareaAriaTracksTextChanges &&
        textareaValidationIsVisible &&
        textareaSyncsParagraphs &&
        elmManagedLightDomIsUntouched &&
        !arrow.defaultPrevented &&
        !arrowUp.defaultPrevented &&
        !bubbledKeys.includes("ArrowLeft") &&

        solutionBecameVisible &&
        solutionHidesWhenCleared &&
        solutionContent()?.textContent ===
          "Erster Absatz.\n\nZweiter Absatz." &&

        quizSpacingIsCompacted &&
